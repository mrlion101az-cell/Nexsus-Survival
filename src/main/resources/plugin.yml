name: NexusSurvival
version: 0.3.0
main: com.nexusuniverse.survival.NexusSurvivalPlugin
api-version: '1.21'
author: Nexus Universe
description: Thirst, radiation zones, and armor hygiene / disease systems.

commands:
  nexussurvival:
    description: NexusSurvival administration.
    aliases: [survival, ns2]
    usage: /nexussurvival <give <waterbottle|gasmask|cure> <disease>|radiation <wand|create|remove|list>|status|resetme|removeall>
    permission: nexussurvival.admin

permissions:
  nexussurvival.admin:
    description: Manage NexusSurvival.
    default: op
