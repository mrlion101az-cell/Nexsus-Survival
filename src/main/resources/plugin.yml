name: NexusSurvival
version: ${project.version}
main: com.nexusuniverse.survival.NexusSurvivalPlugin
api-version: '1.21'
author: Nexus Universe
description: Thirst, radiation zones, armor hygiene, disease (with severity, contagion, and environmental sourcing), and hostile mob overhauls (Feral/TNT/Plague Zombies, limb shooting, crawlers).

commands:
  nexussurvival:
    description: NexusSurvival administration.
    aliases: [survival, ns2]
    usage: /nexussurvival <give <item> [player]|radiation <wand|create|remove|list>|status|resetme|removeall|plaguedeaths|cureplayer <player>|reload>
    permission: nexussurvival.admin

permissions:
  nexussurvival.admin:
    description: Manage NexusSurvival.
    default: op
